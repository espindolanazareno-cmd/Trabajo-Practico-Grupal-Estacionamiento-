<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Control de Estacionamiento</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Control de Estacionamiento</h1>
    <nav class="menu">
      <a href="index.html" class="activo">Playa</a>
      <a href="abonados.html">Abonados mensuales</a>
      <a href="movimientos.html">Movimientos</a>
      <a href="tarifas.html">Tarifas</a>
    </nav>
    <div id="pantalla-led" class="led-panel">
      <span>DISPONIBLES: <strong id="cupos-libres">10</strong></span>
    </div>
  </header>

  <div id="mensaje" class="mensaje" style="margin-top:20px;"></div>

  <main class="grid-container">
    <!-- Tótem de Entrada y Barrera -->
    <section class="card">
      <h2>Tótem de Entrada (Ingreso)</h2>
      
      <!-- Barrera Física Visual -->
      <div class="barrera-container">
        <div class="postede-barrera"></div>
        <div id="brazo-barrera" class="brazo-barrera"></div>
      </div>

      <form id="form-ingreso">
        <label>Patente / Dominio:</label>
        <input type="text" id="patente" placeholder="AA123CD" required>

        <label>Categoría de Vehículo:</label>
        <select id="categoria">
          <option value="Moto">Moto ($100/h)</option>
          <option value="Auto">Auto ($350/h)</option>
          <option value="Camioneta">Camioneta / SUV ($500/h)</option>
          <option value="Bus">Bus ($600/h)</option>
        </select>

        <button type="submit">Generar Ticket e Ingresar</button>
      </form>
    </section>

    <!-- Mapa de Cocheras (Diseño Original) -->
    <section class="card">
      <h2>Mapa de Cocheras</h2>
      <div id="mapa-cocheras" class="cocheras-grid"></div>
    </section>

    <!-- Caja y Salida -->
    <section class="card">
      <h2>Caja y Salida</h2>

      <!-- Barrera Física Visual de Salida -->
      <div class="barrera-container">
        <div class="postede-barrera"></div>
        <div id="brazo-barrera-salida" class="brazo-barrera"></div>
      </div>

      <form id="form-salida">
        <label>Buscar por Folio o Patente:</label>
        <input type="text" id="buscar-ticket" placeholder="Ingrese Folio o Patente" required>
        <button type="submit">Calcular Tarifa</button>
      </form>
      <div id="detalle-cobro" class="comprobante"></div>
    </section>

    <section class="card card-ancha">
      <h2>Últimos Movimientos</h2>
      <div class="tabla-scroll">
        <table class="tabla" id="tabla-ultimos">
          <thead>
            <tr>
              <th>Fecha y hora</th><th>Tipo</th><th>Patente</th><th>Categoría</th><th>Cochera</th>
              <th>Folio</th><th>Cliente</th><th>Cobrado</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p><a href="movimientos.html">Ver todos los movimientos</a></p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
